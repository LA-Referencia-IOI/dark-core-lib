[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-core-lib"
version = "0.1.0"
description = "Unified Python SDK for dARK 2.0 read and write operations"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14,<3.15"
authors = [
    {name = "LA Referencia"}
]
keywords = ["blockchain", "ark", "identifier", "web3", "ethereum", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "web3>=7.16,<8",
    "python-dotenv>=1.0.0",
    "eth-account>=0.14,<0.15",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dark_core_lib*"]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end blockchain integration tests",
]
